name: Build Android TV APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Copy Web Core Assets into Android Project
        run: |
          mkdir -p android/app/src/main/assets
          cp -r src/* android/app/src/main/assets/

      - name: Grant Execute Permission to Gradlew
        run: |
          cd android
          chmod +x gradlew || true
          gradle wrapper

      - name: Build Debug & Release APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlipbookReader-FireTV-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create or Update GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: Flipbook Reader Fire TV APK v1.0.0
          body: |
            ## 📽️ Projector Flipbook Reader (Fire TV Stick 4K / Android TV)
            
            Descarga directa del archivo APK para instalar en Fire TV Stick vía la app Downloader.
            
            - **Archivo:** `app-debug.apk` (o renombrado `FlipbookReader.apk`)
            - **Compatibilidad:** Fire OS / Android TV (armeabi-v7a / arm64-v8a)
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
